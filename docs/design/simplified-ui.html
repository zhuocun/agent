    margin: 0;
    border: 0;
    border-radius: 0;
  }
  .jump { right: 16px; }
}

@keyframes welcome-rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {

  }
  .pulse, .thinking, .welcome-cluster, .welcome-copy, .main.welcome .composer {
    animation: none !important;
    opacity: 1 !important;
  }
}

  <header class="public-header">
    <span class="wordmark">Olune</span>
    <button type="button" class="button quiet">Back to chat</button>
  </header>
  <main class="public-main">
    <h1 class="title">All systems operational</h1>
    <p class="meta">Requests are completing normally.</p>
    <p class="meta">Last 15 minutes: 0 requests, 0 errors.</p>
    <p class="caption">Updated Nov 3, 2026, 4:53 PM · Platform-wide, not your account.</p>
  </main>
</div>
<style>
.public-main .caption { margin-top: var(--s-3); }
</style>
</template>
<template id="view-shared">
<div class="public">
  <header class="public-header">
    <span class="wordmark">Olune</span>
    <button type="button" class="button primary">Start your own chat</button>
  </header>
  <main class="public-main">
    <h1 class="title">Brief thread on your request</h1>
    <p class="caption">Shared chat · read-only</p>
    <div class="column">
      <div class="user-turn">
        <div class="bubble"><p class="body">Explain the difference between optimistic and pessimistic locking.</p></div>
      </div>
      <div class="message">
        <button type="button" class="thought" aria-expanded="false">Thought for 1s<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-chevron-down"/></svg></button>
        <div class="answer body"><p>Right — let's walk through it together. Optimistic locking lets a write proceed, then checks at commit that the row is unchanged. Pessimistic locking claims the row first, so the next writer waits.</p></div>
        <div class="message-foot">
          <p class="meta">Fake</p>
        </div>
      </div>
    </div>
  </main>
</div>
<style>
.public-main .caption { margin-top: var(--s-3); }
</style>
</template>
<template id="view-share-unavailable">

<script>
(function () {
  var stage = document.getElementById("stage");
  var phone = { sidebar: 1, "settings-mobile": 1, "model-reasoning": 1 };
  var phoneTitles = { sidebar: "Sidebar", "settings-mobile": "Settings", "model-reasoning": "Model" };

  function params() {
    return new URLSearchParams(location.hash.replace(/^#/, ""));
  }

  function write(next) {
    var value = next.toString();
    if (location.hash.replace(/^#/, "") === value) {
      render();
      return;
    }
    location.hash = value;
  }

  function themeOf(query) {
    var explicit = query.get("theme");
    if (explicit === "dark" || explicit === "light") return explicit;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function render() {
    var query = params();
    var requested = query.get("view") || "welcome";
    var source = document.getElementById("view-" + requested);
    var view = source ? requested : "welcome";
    if (!source) source = document.getElementById("view-welcome");
    var theme = themeOf(query);
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.classList.toggle("snapshot-clean", query.get("clean") === "1");
    document.documentElement.style.colorScheme = theme;
    if (!source) {
      stage.replaceChildren();
      return;
    }
    if (phone[view]) {
      var css = "";
      document.querySelectorAll("head style").forEach(function (node) { css += node.textContent; });
      var spriteNode = document.getElementById("sprite");
      var title = source.getAttribute("data-title") || phoneTitles[view] || view;
      var frame = document.createElement("iframe");
      frame.className = "phone-frame";
      frame.setAttribute("title", title);
      frame.srcdoc = "<!DOCTYPE html><html lang=\"en\" data-theme=\"" + theme + "\"><head><meta charset=\"utf-8\"><title>" + title.replace(/[&<>]/g, "") + "</title><style>" + css + "</style></head><body>" + spriteNode.outerHTML + source.innerHTML + "</body></html>";
      stage.replaceChildren(frame);
    } else {
      stage.replaceChildren(source.content.cloneNode(true));
    }
    document.querySelectorAll("[data-view]").forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.getAttribute("data-view") === view));
    });
    document.querySelectorAll("[data-theme-value]").forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.getAttribute("data-theme-value") === theme));
    });
  }

  document.querySelectorAll("[data-view]").forEach(function (button) {
    button.addEventListener("click", function () {
      var next = params();
      var id = button.getAttribute("data-view");
      if (id === "welcome") next.delete("view");
      else next.set("view", id);
      write(next);
    });
  });

  document.querySelectorAll("[data-theme-value]").forEach(function (button) {
    button.addEventListener("click", function () {
      var next = params();
      next.set("theme", button.getAttribute("data-theme-value"));
      write(next);
    });
  });

  var scheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (scheme.addEventListener) {
    scheme.addEventListener("change", function () {
      if (!params().get("theme")) render();
    });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
